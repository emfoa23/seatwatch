name: playwright-fetch

# Discovery 전용 (사이트 traffic 분석). 운영 fetch 는 catchtable-fetch.yml / cgv-fetch.yml 로 분리됨.
on:
  workflow_dispatch:
    inputs:
      site:
        description: '대상 사이트 (cgv, megabox, lotte, interpark, catchtable)'
        required: true
        type: string
      query:
        description: '검색어'
        required: true
        type: string

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-fetch/package-lock.json

      - name: Install dependencies
        working-directory: playwright-fetch
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Discover
        working-directory: playwright-fetch
        env:
          SITE: ${{ inputs.site }}
          QUERY: ${{ inputs.query }}
        run: node discover.mjs

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-discover-${{ inputs.site }}
          path: |
            playwright-fetch/*.png
            playwright-fetch/*.json
          if-no-files-found: ignore
          retention-days: 7
