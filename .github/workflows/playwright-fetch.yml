name: playwright-fetch

# Playwright + Chromium 으로 Cloudflare WAF 우회 → 실 endpoint 호출 → Valkey 적재.
# CGV, CatchTable 등 Cloudflare-protected 사이트.
# 또는 discover 모드로 사이트 traffic 분석.
#
# 호출:
#   workflow_dispatch with input `site` (cgv | catchtable | discover) + `queries` (CSV)
#   discover 모드: site=discover, queries="<actual-site>:<query>" 형식

on:
  workflow_dispatch:
    inputs:
      site:
        description: '사이트 또는 discover'
        required: true
        type: choice
        options:
          - cgv
          - catchtable
          - discover
      queries:
        description: '검색어 (CSV) 또는 discover 시 "site:query"'
        required: true
        type: string

concurrency:
  group: playwright-fetch-${{ inputs.site }}-${{ inputs.queries }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-fetch/package-lock.json

      - name: Install dependencies
        working-directory: playwright-fetch
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run fetch / discover
        working-directory: playwright-fetch
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
        run: |
          if [ "${{ inputs.site }}" = "discover" ]; then
            # discover 모드: queries=site:query
            IFS=':' read -r sub_site sub_query <<< "${{ inputs.queries }}"
            echo "discover site=$sub_site query=$sub_query"
            SITE="$sub_site" QUERY="$sub_query" node discover.mjs
          else
            QUERIES='${{ inputs.queries }}' node ${{ inputs.site }}.mjs
          fi

      - name: Upload artifacts (screenshots + discover dumps)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ inputs.site }}
          path: |
            playwright-fetch/*.png
            playwright-fetch/*.json
          if-no-files-found: ignore
          retention-days: 7
