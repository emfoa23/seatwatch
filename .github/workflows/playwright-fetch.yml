name: playwright-fetch

# Playwright + Chromium 으로 Cloudflare WAF 우회 → 실 endpoint 호출 → Valkey 적재.
# CGV, CatchTable 등 Cloudflare-protected 사이트.
#
# 호출:
#   workflow_dispatch with input `site` (cgv | catchtable) + `queries` (CSV)
#   Vercel function 이 GH API 로 트리거.

on:
  workflow_dispatch:
    inputs:
      site:
        description: '사이트 (cgv | catchtable)'
        required: true
        type: choice
        options:
          - cgv
          - catchtable
      queries:
        description: '검색어 (CSV — "마이클,어벤져스" 등)'
        required: true
        type: string

concurrency:
  group: playwright-fetch-${{ inputs.site }}-${{ inputs.queries }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-fetch/package-lock.json

      - name: Install dependencies
        working-directory: playwright-fetch
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run ${{ inputs.site }} fetch
        working-directory: playwright-fetch
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
          QUERIES: ${{ inputs.queries }}
        run: node ${{ inputs.site }}.mjs

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots-${{ inputs.site }}
          path: playwright-fetch/*.png
          if-no-files-found: ignore
          retention-days: 3
