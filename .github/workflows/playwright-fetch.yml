name: playwright-fetch

# CGV 만 Playwright (Cloudflare + 동적 signature 우회 위함).
# CatchTable 은 catchtable-fetch.yml (curl_cffi) 로 분리됨.

on:
  workflow_dispatch:
    inputs:
      site:
        description: '실행 모드'
        required: true
        type: choice
        options:
          - cgv
          - discover
      queries:
        description: '검색어 (CSV) 또는 discover 시 "site:query"'
        required: true
        type: string

concurrency:
  group: playwright-fetch-${{ inputs.site }}-${{ inputs.queries }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-fetch/package-lock.json

      - name: Install dependencies
        working-directory: playwright-fetch
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run
        working-directory: playwright-fetch
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
        run: |
          case "${{ inputs.site }}" in
            discover)
              IFS=':' read -r sub_site sub_query <<< "${{ inputs.queries }}"
              SITE="$sub_site" QUERY="$sub_query" node discover.mjs
              ;;
            *)
              QUERIES='${{ inputs.queries }}' node ${{ inputs.site }}.mjs
              ;;
          esac

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ inputs.site }}
          path: |
            playwright-fetch/*.png
            playwright-fetch/*.json
          if-no-files-found: ignore
          retention-days: 7
