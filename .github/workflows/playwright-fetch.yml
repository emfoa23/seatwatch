name: playwright-fetch

# Playwright + Chromium 으로 Cloudflare WAF 우회 → 실 endpoint 호출 → Valkey 적재 또는 endpoint discovery.
#
# 모드:
#   - cgv / catchtable: search 데이터 fetch (이미 결선)
#   - discover: home → search → 상세 → 예매 navigate (endpoint URL 들 dump)
#   - seat-<site> (cgv-seat / megabox-seat / lotte-seat / interpark-seat / catchtable-seat):
#       site-specific booking flow → 좌석 페이지까지 navigate + endpoint capture

on:
  workflow_dispatch:
    inputs:
      site:
        description: '실행 모드'
        required: true
        type: choice
        options:
          - cgv
          - catchtable
          - catchtable-snapshot
          - discover
          - cgv-seat
          - megabox-seat
          - lotte-seat
          - interpark-seat
          - catchtable-seat
      queries:
        description: '검색어 (CSV), discover 시 "site:query", catchtable-snapshot 시 SHOP_REFS CSV'
        required: true
        type: string

concurrency:
  group: playwright-fetch-${{ inputs.site }}-${{ inputs.queries }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright-fetch/package-lock.json

      - name: Install dependencies
        working-directory: playwright-fetch
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run fetch / discover / seat
        working-directory: playwright-fetch
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
        run: |
          case "${{ inputs.site }}" in
            discover)
              IFS=':' read -r sub_site sub_query <<< "${{ inputs.queries }}"
              echo "discover site=$sub_site query=$sub_query"
              SITE="$sub_site" QUERY="$sub_query" node discover.mjs
              ;;
            catchtable-snapshot)
              SHOP_REFS='${{ inputs.queries }}' node catchtable-snapshot.mjs
              ;;
            *-seat)
              QUERY='${{ inputs.queries }}' node ${{ inputs.site }}.mjs
              ;;
            *)
              QUERIES='${{ inputs.queries }}' node ${{ inputs.site }}.mjs
              ;;
          esac

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ inputs.site }}
          path: |
            playwright-fetch/*.png
            playwright-fetch/*.json
          if-no-files-found: ignore
          retention-days: 7
