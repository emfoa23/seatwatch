name: cgv-fetch

# CGV curl_cffi + HMAC-SHA256 signature (JS bundle 역공학).
# Cloudflare WAF 통과 + signature 자체 생성 → Vercel 함수가 binary 의존성 없이 호출 가능한
# 별도 endpoint. 비용/속도 면에서 Playwright 보다 압도적.
#
# workflow_dispatch:
#   mode=search,   queries="마이클,어벤져스"     → search 캐시 + events:cgv
#   mode=snapshot, queries="30001115,30001046"  → 모든 인기 극장 회차 적재

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '모드'
        required: true
        type: choice
        options:
          - search
          - snapshot
      queries:
        description: '검색어 (CSV) 또는 movNo (CSV)'
        required: true
        type: string

concurrency:
  group: cgv-fetch-${{ inputs.mode }}-${{ inputs.queries }}
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run cgv fetch
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "${{ inputs.mode }}" = "search" ]; then
            QUERIES='${{ inputs.queries }}' python scripts/cgv_fetch.py
          else
            MOV_NOS='${{ inputs.queries }}' python scripts/cgv_fetch.py
          fi
