name: monitor-freshness

# cron-job.org → workflow_dispatch (15분).
# Valkey/Neon 신선도 + 실패율 체크. 임계 초과 시 GitHub Issue 자동 생성.
# metrics/YYYY-MM-DD.json 누적 commit.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [monitor]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Run monitor
        env:
          VALKEY_URL: ${{ secrets.VALKEY_URL }}
          VALKEY_KEY_PREFIX: ${{ secrets.VALKEY_KEY_PREFIX }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/monitor.py

      - name: Commit metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add metrics/
          if ! git diff --cached --quiet; then
            git commit -m "chore(monitor): metrics $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "no metrics changes"
          fi
