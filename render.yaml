# Render Blueprint — seatwatch notify-worker
#
# 알림 큐 (Valkey notify:queue) consumer.
# Render free 는 background worker 미지원이라 cron job 으로 운영:
#   - 매 1분마다 짧게 실행 (worker 진입점이 큐를 한 차례 drain 후 종료).
#   - 알림 최대 1분 지연 — slot 단위 빈자리 알림에 충분.
#
# 운영 도입 후 실시간성이 더 필요하면 starter ($7/월) worker 로 전환 가능.

services:
  - type: cron
    name: seatwatch-notify
    runtime: node
    region: singapore
    plan: free
    schedule: "* * * * *"  # 매 분
    rootDir: worker
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VALKEY_KEY_PREFIX
        value: seatwatch:prod
      - key: NOTIFY_RUN_MODE
        value: drain
      - key: DATABASE_URL
        sync: false
      - key: VALKEY_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
